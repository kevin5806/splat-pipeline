name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  workflow_dispatch:

# Nelle pull request un nuovo push sostituisce il precedente; su main NO: le build delle immagini durano
# decine di minuti e annullarle a ogni push le farebbe ripartire da zero (i lanci si mettono in fila).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (backend + pannello)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Test del backend (modalità simulata, senza GPU)
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest httpx
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build del pannello
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  image:
    name: Immagine Docker (${{ matrix.variant }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPU recenti (Volta in su)
          - variant: standard
            pascal: "0"
            suffix: ""
            max_jobs: "8"
          # GPU Pascal (Tesla P4/P40, GTX 10xx): compila gsplat con la patch, richiede più tempo
          - variant: pascal
            pascal: "1"
            suffix: "-pascal"
            # il runner ha 16 GB: con più di 2-3 compilazioni nvcc insieme la memoria finisce e il runner si spegne
            max_jobs: "2"
    steps:
      # L'immagine base di Nerfstudio pesa ~17 GB da scompattata: i runner ne hanno ~14 liberi, quindi si fa spazio.
      - name: Libera spazio su disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Accesso a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome e tag dell'immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build e push (nelle pull request solo build)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PASCAL_PATCH=${{ matrix.pascal }}
            MAX_JOBS=${{ matrix.max_jobs }}
          # Cache nel registro (GHCR), non in quella di GitHub (10 GB, troppo piccola): lo strato della variante P4 con CUDA e
          # gsplat compilato pesa alcuni GB e costa 30-50 minuti, così si rifà solo se cambiano docker/pascal_patch.sh o la base.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', github.repository, matrix.variant) || '' }}
