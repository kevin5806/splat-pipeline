name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (backend + pannello)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Test del backend (modalità simulata, senza GPU)
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest httpx
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build del pannello
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  image:
    name: Immagine Docker (${{ matrix.variant }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPU recenti (Volta in su)
          - variant: standard
            pascal: "0"
            suffix: ""
          # GPU Pascal (Tesla P4/P40, GTX 10xx): compila gsplat con la patch, richiede più tempo
          - variant: pascal
            pascal: "1"
            suffix: "-pascal"
    steps:
      # L'immagine base di Nerfstudio pesa ~17 GB da scompattata: i runner ne hanno ~14 liberi, quindi si fa spazio.
      - name: Libera spazio su disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Accesso a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome e tag dell'immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build e push (nelle pull request solo build)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PASCAL_PATCH=${{ matrix.pascal }}
          # cache dei soli strati nostri (quelli dell'immagine base arrivano già dal registro)
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Prova rapida dell'immagine (senza GPU)
        if: github.event_name != 'pull_request'
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm --entrypoint python "$IMG" -c "import fastapi, pydantic, numpy, nerfstudio; print('dipendenze ok')"
          docker run --rm --entrypoint bash "$IMG" -c "which colmap ffmpeg ns-train ns-export ns-eval"
